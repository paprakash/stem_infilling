exp: restormer_ft_dw10
# Defect-weighted fine-tune from restormer_v1 iter_100000 (--init-from).
# Charbonnier weighted 10x inside defect+vacuum mask disks; peak LR ~1/3 of
# base run for fine-tune stability; everything else unchanged.
model:
  name: restormer
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
data:
  crop: 384
  batch: 6
  workers: 8
optim:
  lr: 1.0e-4
  min_lr: 1.0e-6
  betas: [0.9, 0.999]
  weight_decay: 1.0e-4
loss:
  fft_weight: 0.1
  charb_eps: 1.0e-3
  defect_weight: 10.0
train:
  total_iters: 25000
  val_every: 1000
  full_val_every: 5000
  ckpt_every: 1000
  milestone_every: 5000
  log_every: 100
  overfit_iters: 4000
  seed: 20260714
