exp: nafnet_w32_v1
model:
  name: nafnet
  width: 32
  enc_blks: [2, 2, 4, 8]
  middle_blk_num: 12
  dec_blks: [2, 2, 2, 2]
data:
  crop: 384
  batch: 16
  workers: 8
optim:
  # NAFNet paper: AdamW lr 1e-3 -> 1e-7 cosine, betas (0.9, 0.9), wd 0
  lr: 1.0e-3
  min_lr: 1.0e-7
  betas: [0.9, 0.9]
  weight_decay: 0.0
loss:
  fft_weight: 0.1
  charb_eps: 1.0e-3
train:
  total_iters: 100000
  val_every: 1000
  full_val_every: 5000
  ckpt_every: 1000
  milestone_every: 5000
  log_every: 100
  overfit_iters: 1500
  seed: 20260713
